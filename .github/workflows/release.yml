name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, intl, zip, json, iconv
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Check version
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMPOSER_VERSION=$(jq -r '.extra["typo3/cms"].version' composer.json)
          EMCONF_VERSION=$(php -r '$_EXTKEY = "t3extension_tools"; include "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')
          if [ "$COMPOSER_VERSION" != "$VERSION" ] || [ "$EMCONF_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $VERSION does not match composer.json ($COMPOSER_VERSION) or ext_emconf.php ($EMCONF_VERSION)"
            exit 1
          fi

      - name: Run quality checks
        run: |
          composer validate --strict
          composer lint:php
          composer sca:php
          composer test:unit

      - name: Create release notes
        run: |
          VERSION=${GITHUB_REF_NAME}
          # Section of ChangeLog that starts with the release line of this version, up to the next blank line
          awk -v v="$VERSION" '
            index($0, "Release of t3extension_tools " v " ") || index($0, "Release of t3extension-tools " v " ") { found = 1; next }
            found && /^$/ { exit }
            found { print "- " substr($0, 12) }
          ' ChangeLog > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See commit history for details." > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release_notes.md
          fi

  publish-packagist:
    name: Update Packagist
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_TOKEN" ]; then
            curl -XPOST -H'content-type:application/json' \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
              -d'{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
          else
            echo "Packagist token not configured, skipping auto-update"
          fi
