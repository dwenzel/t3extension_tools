name: t3extension-tools
type: typo3
docroot: .Build/Web
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
database:
  type: mariadb
  version: "10.11"
webimage_extra_packages:
  - php8.4-pcov
composer_version: "2"
web_environment:
  - typo3DatabaseName=func_test
  - typo3DatabaseHost=db
  - typo3DatabaseUsername=root
  - typo3DatabasePassword=root
